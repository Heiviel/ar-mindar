<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AR Prototype - MindAR + Three.js</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #container { width:100vw; height:100vh; position:relative; overflow:hidden; }
  #camBg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #startBtn {
    position:absolute; z-index:10; left:50%; top:50%; transform:translate(-50%,-50%);
    padding:14px 24px; font:16px system-ui, sans-serif; background:#111; color:#fff;
    border:1px solid #fff; border-radius:8px;
  }
  #hint {
    position:absolute; z-index:10; left:0; right:0; bottom:16px; text-align:center;
    color:#fff; font:14px system-ui, sans-serif; opacity:.8; pointer-events:none;
  }
</style>
</head>
<body>
  <div id="container">
    <video id="camBg" autoplay muted playsinline></video>
  </div>
  <button id="startBtn">Iniciar cámara AR</button>
  <div id="hint" hidden>Enfoca el marcador impreso con la cámara</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mind-ar": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mind-ar';

    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');

    startBtn.addEventListener('click', async () => {
      startBtn.remove();
      hint.hidden = false;

      const mindarThree = new MindARThree({
        container: document.querySelector('#container'),
        imageTargetSrc: './targets/bola.mind',
      });

      const { renderer, scene, camera } = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(0, 1, 1);
      scene.add(dirLight);

      const anchor = mindarThree.addAnchor(0);

      const loader = new GLTFLoader();
      loader.load(
        './models/bola.glb',
        (gltf) => {
          const model = gltf.scene;
          // Tamaño y posición se respetan tal cual vienen del GLB (calibrados
          // en Blender contra un plano de referencia = ancho del marcador).
          anchor.group.add(model);
        },
        undefined,
        (err) => console.error('Error cargando modelo 3D:', err)
      );

      await mindarThree.start();

      // El <video> interno de MindAR a veces no pinta (bug conocido: negro en
      // Android/Windows con varias cámaras). Reusamos su MISMO stream de cámara
      // en nuestro propio <video>, que sí sabemos que funciona.
      const camBg = document.getElementById('camBg');
      if (mindarThree.video && mindarThree.video.srcObject) {
        camBg.srcObject = mindarThree.video.srcObject;
        camBg.play().catch((err) => console.error('camBg.play() falló:', err));
      }

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
